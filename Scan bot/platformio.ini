[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_echo = yes
lib_deps = 
	madhephaestus/ESP32Servo@^3.0.5
	adafruit/Adafruit GFX Library@^1.11.9
	adafruit/Adafruit SSD1306@^2.5.9
	links2004/WebSockets@^2.4.1
	bblanchon/ArduinoJson@^7.0.4

; NOTE: "board = esp32dev" is the generic ESP32 dev board setting and works for
; most ESP32-WROOM-32 dev kits (the common blue/black breakout boards). If your
; board doesn't upload/connect with this, tell me the exact board name/model
; printed on it and I'll give you the right board ID.